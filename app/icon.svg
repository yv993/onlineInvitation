<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- ԿՆԻՔ — the wax seal, pressed: the mark the whole product is named for.
       Drawn for legibility at 16px: one wax disc, one letter, no hairlines. -->
  <rect width="64" height="64" rx="14" fill="#F3EFE7"/>
  <!-- the poured wax: an uneven rim, as a real seal cools -->
  <circle cx="32" cy="32" r="23" fill="#8A6A3B"/>
  <circle cx="26" cy="24" r="6" fill="#8A6A3B"/>
  <circle cx="41" cy="21" r="4.5" fill="#8A6A3B"/>
  <circle cx="44" cy="40" r="5" fill="#8A6A3B"/>
  <circle cx="22" cy="42" r="4.5" fill="#8A6A3B"/>
  <circle cx="32" cy="32" r="19" fill="#B08D57"/>
  <!-- the pressed ring -->
  <circle cx="32" cy="32" r="15.5" fill="none" stroke="#8A6A3B" stroke-width="1.6" opacity="0.75"/>
  <!-- Կ, cut into the wax -->
  <text x="32" y="41" text-anchor="middle" font-family="Sylfaen, Georgia, serif" font-size="26" font-weight="700" fill="#F7F3EA">Կ</text>
</svg>
